[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hahino-mp"
version = "1.0.0"
description = "Self-structuring multi-path neural network: loss-driven width growth, expert birth and pruning, WTA/SUM readout with no router, freeze sovereignty, and continual learning without catastrophic forgetting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
examples = ["torchvision>=0.15"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Nahino/hahino-mp"

[tool.setuptools]
packages = ["hahino_mp"]
